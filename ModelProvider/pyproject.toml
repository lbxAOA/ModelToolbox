[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltoolbox-provider"
version = "0.2.3"
description = "Provider management for ModelToolbox: runtime and provider switching."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "modeltoolbox-core>=0.2.0",
    "click>=8.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["modeltoolbox_provider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
