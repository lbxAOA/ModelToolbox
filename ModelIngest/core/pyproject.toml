[project]
name = "modelingest-core"
version = "2.0.0"
description = "ModelIngest 核心编排包（管道接口、配置系统、编排器）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]
dependencies = [
    "modelingest-common>=2.0.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelingest_core*"]
