[project]
name = "modelingest-fetch"
version = "2.0.0"
description = "ModelIngest 内容获取阶段（网页爬取、本地扫描）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]
dependencies = [
    "modelingest-common>=2.0.0",
    "modelingest-core>=2.0.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelingest_fetch*"]
