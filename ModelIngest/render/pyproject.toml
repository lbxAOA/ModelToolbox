[project]
name = "modelingest-render"
version = "2.0.0"
description = "ModelIngest 视觉渲染阶段（网页/PDF → 截图瓦片）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]
dependencies = [
    "modelingest-common>=2.0.0",
    "modelingest-core>=2.0.0",
    "playwright>=1.40",
    "Pillow>=10.0",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelingest_render*"]
