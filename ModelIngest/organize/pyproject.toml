[project]
name = "modelingest-organize"
version = "2.0.0"
description = "ModelIngest 知识库组织阶段（wikilink + MOC + 分类）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]
dependencies = [
    "modelingest-common>=2.0.0",
    "modelingest-core>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelingest_organize*"]
