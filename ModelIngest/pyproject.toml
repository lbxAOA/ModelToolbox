[project]
name = "modelingest"
version = "2.0.0"
description = "多模态文档 → 结构化知识库转换器（视觉+文本双通道）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]

# 元包：依赖所有核心包
dependencies = [
    "modelingest-common>=2.0.0",
    "modelingest-core>=2.0.0",
    "modelingest-parse>=2.0.0",
    "modelingest-clean>=2.0.0",
]

[project.optional-dependencies]
# 视觉处理
visual = ["modelingest-render>=2.0.0"]

# 内容获取
fetch = ["modelingest-fetch>=2.0.0"]

# 知识蒸馏
distill = ["modelingest-distill>=2.0.0"]

# 知识组织
organize = ["modelingest-organize>=2.0.0"]

# 完整功能
all = [
    "modelingest-render>=2.0.0",
    "modelingest-fetch>=2.0.0",
    "modelingest-distill>=2.0.0",
    "modelingest-organize>=2.0.0",
]

# 开发依赖
dev = [
    "pytest>=8",
    "pytest-cov>=4",
]

[project.scripts]
modelingest = "modelingest_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
