[project]
name = "modelingest-parse"
version = "2.0.0"
description = "ModelIngest 解析阶段（文档 → Markdown，支持多解析器）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lbxAOA" }]
dependencies = [
    "modelingest-common>=2.0.0",
    "modelingest-core>=2.0.0",
    "markitdown[all]>=0.0.1a2",  # 默认解析器
]

[project.optional-dependencies]
# 高级解析器（可选）
docling = ["docling>=2.0"]
mineru = ["mineru>=0.8"]
visual = ["Pillow>=10.0"]  # 视觉解析器
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["modelingest_parse*"]
