name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Existing version tag (for example, v1.9.0-beta.1)"
                required: true
                type: string

env:
    RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

concurrency:
    group: release-${{ github.event.inputs.version || github.ref_name }}
    cancel-in-progress: false

jobs:
    prepare:
        name: Prepare Release
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            commit_sha: ${{ steps.release.outputs.commit_sha }}
            prerelease: ${{ steps.release.outputs.prerelease }}
            published_at: ${{ steps.release.outputs.published_at }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

            - name: Resolve release metadata
              id: release
              shell: bash
              run: |
                  if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Invalid release tag: $RELEASE_TAG" >&2
                      exit 1
                  fi

                  VERSION="${RELEASE_TAG#v}"
                  COMMIT_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
                  if [[ "$(git rev-parse HEAD)" != "$COMMIT_SHA" ]]; then
                      echo "Checkout does not match $RELEASE_TAG" >&2
                      exit 1
                  fi

                  PREVIOUS_TAG=""
                  if PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null); then
                      # 1.9.1 includes the full update history since 1.2.1.
                      if [[ "$VERSION" == "1.9.1" ]]; then
                          PREVIOUS_TAG="v1.2.1"
                      fi
                      git merge-base --is-ancestor "$PREVIOUS_TAG" "$RELEASE_TAG"
                      CHANGELOG_RANGE="${PREVIOUS_TAG}..${RELEASE_TAG}"
                  else
                      # The first release has no previous tag. git-cliff v2 no
                      # longer accepts --root, and no range means full history.
                      CHANGELOG_RANGE=""
                  fi
                  PRERELEASE=false
                  if [[ "$VERSION" == *-* ]]; then
                      PRERELEASE=true
                  fi

                  echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
                  echo "published_at=$(git show -s --format=%cI "$COMMIT_SHA")" >> "$GITHUB_OUTPUT"
                  echo "range=$CHANGELOG_RANGE" >> "$GITHUB_OUTPUT"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install release tooling
              working-directory: crates/desktop
              run: bun install --frozen-lockfile

            - name: Check bundled release notes
              working-directory: crates/desktop
              run: bun run release-notes:check

            - name: Generate technical changelog
              uses: orhun/git-cliff-action@v4
              with:
                  config: cliff.toml
                  args: ${{ steps.release.outputs.range }} -vv --strip header
              env:
                  OUTPUT: CHANGES.md
                  GITHUB_REPO: ${{ github.repository }}

            - name: Render release notes
              working-directory: crates/desktop
              env:
                  RELEASE_VERSION: ${{ steps.release.outputs.version }}
              run: >-
                  bun run release-notes:render --
                  --version "$RELEASE_VERSION"
                  --changelog ../../CHANGES.md
                  --output ../../release-body.md

            - name: Verify release notes
              shell: bash
              run: test -s release-body.md

            - name: Upload release metadata
              uses: actions/upload-artifact@v7
              with:
                  name: release-metadata
                  path: release-body.md
                  if-no-files-found: error
                  retention-days: 7

    build-tauri:
        needs: prepare
        name: Build Desktop (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      prerelease_args: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      prerelease_args: --bundles nsis

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Cargo fetch
              run: cargo fetch

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install frontend dependencies
              working-directory: crates/desktop
              run: bun install --frozen-lockfile

            - name: Build Tauri
              uses: tauri-apps/tauri-action@v1
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  args: >-
                      --target ${{ matrix.target }}
                      ${{ needs.prepare.outputs.prerelease == 'true' && matrix.prerelease_args || '' }}
                  projectPath: crates/desktop
                  uploadUpdaterJson: false

            - name: Prepare generic artifact
              shell: bash
              run: |
                  if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
                      find target -type f -name "*setup.exe" -exec cp {} model-toolbox-windows-setup.exe \;
                      echo "GENERIC_ASSET=model-toolbox-windows-setup.exe" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
                      find target -type f -name "*.AppImage" -exec cp {} model-toolbox-linux.AppImage \;
                      echo "GENERIC_ASSET=model-toolbox-linux.AppImage" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
                      find target -type f -name "*.dmg" -exec cp {} model_toolbox_mac_intel.dmg \;
                      echo "GENERIC_ASSET=model_toolbox_mac_intel.dmg" >> "$GITHUB_ENV"
                  elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
                      find target -type f -name "*.dmg" -exec cp {} model_toolbox_mac_arm.dmg \;
                      echo "GENERIC_ASSET=model_toolbox_mac_arm.dmg" >> "$GITHUB_ENV"
                  fi

            - name: Upload desktop artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-${{ matrix.target }}
                  path: |
                      target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                      target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
                      target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
                      target/${{ matrix.target }}/release/bundle/deb/*.deb
                      target/${{ matrix.target }}/release/bundle/rpm/*.rpm
                      target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
                      target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
                      target/${{ matrix.target }}/release/bundle/nsis/*.exe
                      target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
                      ${{ env.GENERIC_ASSET }}
                  if-no-files-found: error
                  retention-days: 7

    build-cli:
        needs: prepare
        name: Build CLI (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            SCCACHE_GHA_ENABLED: "true"
            RUSTC_WRAPPER: "sccache"
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Setup sccache
              uses: mozilla-actions/sccache-action@v0.0.11

            - name: Rust cache
              uses: Swatinem/rust-cache@v2

            - name: Cargo fetch
              run: cargo fetch

            - name: Build CLI
              run: cargo build --release -p model-toolbox-cli --target ${{ matrix.target }}

            - name: Package CLI (Unix)
              if: matrix.os != 'windows-latest'
              run: |
                  tar -czvf model-toolbox-cli-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release model-toolbox-cli

            - name: Package CLI (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  Compress-Archive -Path target/${{ matrix.target }}/release/model-toolbox-cli.exe -DestinationPath model-toolbox-cli-${{ matrix.target }}.zip

            - name: Upload CLI artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: cli-${{ matrix.target }}
                  path: model-toolbox-cli-*
                  if-no-files-found: error
                  retention-days: 7

    publish-release:
        needs: [prepare, build-tauri, build-cli]
        name: Publish Release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install release tooling
              working-directory: crates/desktop
              run: bun install --frozen-lockfile

            - name: Download release metadata
              uses: actions/download-artifact@v8
              with:
                  name: release-metadata
                  path: release-metadata

            - name: Download desktop artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: desktop-*
                  path: release-inputs

            - name: Download CLI artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: cli-*
                  path: release-inputs

            - name: Prepare release assets
              working-directory: crates/desktop
              env:
                  RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
                  RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
              run: >-
                  bun run release-assets:prepare --
                  --source ../../release-inputs
                  --output ../../release-assets
                  --version "$RELEASE_VERSION"
                  --tag "$RELEASE_TAG"
                  --repository "$GITHUB_REPOSITORY"
                  --published-at "$RELEASE_PUBLISHED_AT"
                  --notes ../../release-metadata/release-body.md

            - name: Create or update GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ env.RELEASE_TAG }}
                  target_commitish: ${{ needs.prepare.outputs.commit_sha }}
                  name: model-toolbox ${{ env.RELEASE_TAG }}
                  body_path: release-metadata/release-body.md
                  draft: false
                  prerelease: ${{ needs.prepare.outputs.prerelease }}
                  make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
                  files: release-assets/*
                  fail_on_unmatched_files: true

            - name: Verify published release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  test -n "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.body')"
                  test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '[.assets[].name] | index("latest.json") != null')" = "true"
                  test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.prerelease')" = "${{ needs.prepare.outputs.prerelease }}"
