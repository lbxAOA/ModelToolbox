name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e . pip-licenses
      - name: Compile
        run: python -m compileall ModelCore ModelIngest ModelProvider ModelOffice ModelMemory ModelMCP ModelSkill ModelTraining
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          mtb --help
          mtb version
          mtb doctor
          mtb provider list --json
      - name: License gate
        run: pip-licenses --fail-on "GPL-3.0;AGPL-3.0"