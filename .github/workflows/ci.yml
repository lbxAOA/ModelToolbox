name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Source-checkout CLI smoke
        run: python cli/main.py version
      - name: First-party Python tests
        run: python tools/test/run.py
      - name: Delivery-boundary audit
        run: python tools/audit/check_zero_components.py

  tui:
    name: Terminal package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source syntax
        run: |
          node --check tui/src/app.mjs
          node --check tui/src/render.mjs
      - name: Inspect npm package contents
        working-directory: tui
        run: npm pack --dry-run --json --ignore-scripts --workspaces=false

  flutter-linux:
    name: Flutter Linux desktop build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Install Linux desktop build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev
      - name: Restore Flutter packages
        working-directory: flutter
        shell: bash
        run: flutter pub get
      - name: Analyze, test, and build Linux desktop
        working-directory: flutter
        shell: bash
        run: |
          flutter analyze
          flutter test
          flutter build linux --release

  flutter:
    name: Flutter desktop checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Flutter SDK is available
        shell: bash
        run: flutter --version
      - name: Restore Flutter packages
        working-directory: flutter
        shell: bash
        run: flutter pub get
      - name: Analyze and test
        working-directory: flutter
        shell: bash
        run: |
          flutter analyze
          flutter test
