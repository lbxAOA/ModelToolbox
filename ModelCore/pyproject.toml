[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modeltoolbox-core"
version = "0.2.3"
description = "Core utilities for ModelToolbox: logging, telemetry, configuration, and plugin system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "typer>=0.12",
    "rich>=13.0.0",
]

[project.scripts]
mtb-core = "modeltoolbox_core.cli:main"

[project.optional-dependencies]
ui = [
    "textual>=0.88.0",
]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["modeltoolbox_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
